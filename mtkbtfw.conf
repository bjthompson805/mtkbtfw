#
# Download MediaTek MT79xx Bluetooth firmware.  ng_ubt attaches first;
# mtkbtfw detaches it, loads the patch and resets the device so ng_ubt
# attaches again against a working chip.
#

# MT7925, ASUS Zenbook S 16 (UM5606WA)
notify 100 {
	match "system"		"USB";
	match "subsystem"	"DEVICE";
	match "type"		"ATTACH";
	match "vendor"		"0x13d3";
	match "product"		"0x3608";
	action "/usr/local/sbin/mtkbtfw -d $cdev";
};
